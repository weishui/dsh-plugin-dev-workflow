<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">DSH Dev Workflow 研发交付闭环信息图</title><desc id="desc">从用户需求到可验证交付的五步闭环、七个工具和本地 JSONL 记录结构。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef7f8"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#173e5e"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12324a" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#159bb8"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif}
 .title{font-size:44px;font-weight:800;fill:#102a43}.subtitle{font-size:21px;fill:#567286}.h{font-size:22px;font-weight:800;fill:#102a43}.body{font-size:17px;fill:#496679}.small{font-size:15px;fill:#6a8493}.num{font-size:25px;font-weight:800;fill:#fff}.card{fill:#fff;stroke:#cfe2e9;stroke-width:2}.cyan{fill:#0b9fbd}.amber{fill:#f2a900}.green{fill:#22a66f}.red{fill:#e56a65}
 </style>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<!-- header -->
<g class="sans"><text x="70" y="75" class="title">DSH Dev Workflow</text><text x="70" y="115" class="subtitle">把一次 AI coding 对话，变成可追溯、可验证、可交接的研发交付记录</text><rect x="70" y="145" width="1460" height="2" fill="#d5e7ed"/></g>
<!-- left problem -->
<g class="sans" filter="url(#shadow)"><rect x="70" y="185" width="360" height="455" rx="22" class="card"/><rect x="70" y="185" width="360" height="62" rx="22" fill="#fff0ef"/><rect x="70" y="225" width="360" height="22" fill="#fff0ef"/><circle cx="108" cy="216" r="18" class="red"/><text x="108" y="224" text-anchor="middle" class="num">!</text><text x="140" y="224" class="h">没有闭环时</text>
<text x="100" y="290" class="body">需求散在聊天里</text><text x="100" y="317" class="small">“顺便把登录页改一下”</text><path d="M100 345h275M100 362h210M100 379h250" stroke="#d9e4e9" stroke-width="9" stroke-linecap="round"/>
<text x="100" y="430" class="body">验证只能凭口头描述</text><text x="100" y="457" class="small">“应该已经测过了”</text><rect x="100" y="482" width="250" height="42" rx="10" fill="#fff7e1"/><text x="120" y="509" class="small">没有命令 · 没有退出码</text>
<text x="100" y="575" class="body">反馈容易污染长期记忆</text><text x="100" y="602" class="small">一次偏好 ≠ 永久规范</text></g>
<!-- middle bridge -->
<g class="sans"><path d="M455 410h100" stroke="#159bb8" stroke-width="5" marker-end="url(#arrow)"/><text x="460" y="380" class="small">用证据链整理</text><circle cx="635" cy="395" r="90" fill="#e2f8fb"/><circle cx="635" cy="395" r="67" fill="url(#navy)"/><path d="M635 345l15 35 38 15-38 15-15 38-15-38-38-15 38-15Z" fill="#ffd166"/><text x="635" y="525" text-anchor="middle" class="h">冷静 · 克制 · 可追责</text><text x="635" y="552" text-anchor="middle" class="small">先问清楚，再动手</text></g>
<!-- five steps -->
<g class="sans"><text x="790" y="205" class="h">五步闭环：每一步都留下可回看的证据</text>
<!-- connecting line --> <path d="M838 265V850" stroke="#9bd9e3" stroke-width="4" stroke-dasharray="8 10"/>
<g filter="url(#shadow)"><rect x="790" y="235" width="700" height="105" rx="18" class="card"/><circle cx="838" cy="287" r="28" class="cyan"/><text x="838" y="296" text-anchor="middle" class="num">1</text><text x="890" y="278" class="h">REQUEST · 登记需求</text><text x="890" y="308" class="body">保留用户原话、范围、验收条件；缺验收时先澄清，不自动开工。</text><rect x="1290" y="264" width="155" height="38" rx="19" fill="#e3f8fb"/><text x="1368" y="289" text-anchor="middle" class="small">dev_request_capture</text></g>
<g filter="url(#shadow)"><rect x="790" y="355" width="700" height="105" rx="18" class="card"/><circle cx="838" cy="407" r="28" class="amber"/><text x="838" y="416" text-anchor="middle" class="num">2</text><text x="890" y="398" class="h">FEEDBACK · 记录反馈</text><text x="890" y="428" class="body">保存原话、决策和影响；反馈会改变任务，但不会悄悄变成团队规范。</text><rect x="1290" y="384" width="155" height="38" rx="19" fill="#fff3d4"/><text x="1368" y="409" text-anchor="middle" class="small">dev_feedback_record</text></g>
<g filter="url(#shadow)"><rect x="790" y="475" width="700" height="105" rx="18" class="card"/><circle cx="838" cy="527" r="28" class="cyan"/><text x="838" y="536" text-anchor="middle" class="num">3</text><text x="890" y="518" class="h">TASK · 拆解任务</text><text x="890" y="548" class="body">记录步骤、依赖、风险和验收；跨范围或破坏性动作先等待用户确认。</text><rect x="1290" y="504" width="155" height="38" rx="19" fill="#e3f8fb"/><text x="1368" y="529" text-anchor="middle" class="small">dev_task_plan</text></g>
<g filter="url(#shadow)"><rect x="790" y="595" width="700" height="105" rx="18" class="card"/><circle cx="838" cy="647" r="28" class="green"/><text x="838" y="656" text-anchor="middle" class="num">4</text><text x="890" y="638" class="h">VERIFY · 记录验证</text><text x="890" y="668" class="body">记录真实命令、退出码和结果；没有通过证据，不能声称 succeeded。</text><rect x="1290" y="624" width="155" height="38" rx="19" fill="#e5f8ef"/><text x="1368" y="649" text-anchor="middle" class="small">dev_verify</text></g>
<g filter="url(#shadow)"><rect x="790" y="715" width="700" height="105" rx="18" class="card"/><circle cx="838" cy="767" r="28" class="amber"/><text x="838" y="776" text-anchor="middle" class="num">5</text><text x="890" y="758" class="h">COMPLETION · 交付收口</text><text x="890" y="788" class="body">汇总变更文件、验证证据、风险、未完成项和下一步，形成可交接结论。</text><rect x="1290" y="744" width="155" height="38" rx="19" fill="#fff3d4"/><text x="1368" y="769" text-anchor="middle" class="small">dev_complete</text></g>
</g>
<!-- bottom record / tools -->
<g class="sans" filter="url(#shadow)"><rect x="70" y="690" width="650" height="255" rx="22" fill="#102a43"/><text x="105" y="735" fill="#bff6ff" font-size="22" font-weight="800">本地记录：append-only JSONL</text><text x="105" y="770" fill="#d9e7ed" font-size="17">每个项目独立保存，不上传到外部服务</text><text x="105" y="814" fill="#8bd9e6" font-size="17">.dsh-dev/</text><text x="140" y="845" fill="#d9e7ed" font-size="16">├── requests.jsonl</text><text x="140" y="872" fill="#d9e7ed" font-size="16">├── feedback.jsonl   ├── tasks.jsonl</text><text x="140" y="899" fill="#d9e7ed" font-size="16">└── verifications.jsonl / completions.jsonl / knowledge.jsonl</text></g>
<g class="sans"><rect x="70" y="975" width="1420" height="70" rx="18" fill="#e2f8fb" stroke="#b6e8ef"/><text x="105" y="1018" class="h">七个工具协作</text><text x="280" y="1018" class="body">context_get · request_capture · feedback_record · task_plan · verify · complete · knowledge_promote</text><text x="1450" y="1018" text-anchor="end" class="small">DSH ≥ 0.2.1-rc.2</text></g>
</svg>
