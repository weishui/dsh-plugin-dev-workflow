<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
<title id="title">DSH Dev Workflow：从模糊的想法到下次还能接着做</title>
<desc id="desc">人设、看板、流程三个零件，以及想法 → 需求 → 任务 → 验证 → 完成五步如何落进项目里的只追加记录。</desc>
<rect width="1600" height="680" fill="#fbfaf8"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', system-ui, sans-serif">
  <text x="80" y="80" font-size="16" letter-spacing="2.4" fill="#9a958c">DSH PLUGIN · 轻量开发 WORKFLOW</text>
  <text x="80" y="148" font-size="46" font-weight="700" fill="#1a1917">从模糊的想法，到下次还能接着做</text>
  <text x="80" y="190" font-size="20" fill="#6b6760">人设 · 看板 · 流程 —— 聊天里说过的话，落在项目里</text>

  <line x1="980" y1="96" x2="980" y2="304" stroke="#ddd7cd" stroke-width="1"/>
  <text x="1020" y="112" font-size="19" font-weight="700" fill="#1a1917">人设 · 会记账的搭档</text>
  <text x="1020" y="138" font-size="15" fill="#6b6760">选一个 preset 开始聊；不替你决定产品，但不漏记</text>
  <text x="1020" y="186" font-size="19" font-weight="700" fill="#1a1917">看板 · 想法不再是聊天记录</text>
  <text x="1020" y="212" font-size="15" fill="#6b6760">四列摆在眼前：需求 / 待办 / 待确认 / 已完成</text>
  <text x="1020" y="260" font-size="19" font-weight="700" fill="#1a1917">流程 · 一条能复盘的线</text>
  <text x="1020" y="286" font-size="15" fill="#6b6760">Request → Feedback → Task → Verify → Completion</text>

  <line x1="80" y1="404" x2="1408" y2="404" stroke="#ddd7cd" stroke-width="1"/>
  <circle cx="80" cy="404" r="4" fill="#a8473c"/>
  <circle cx="352" cy="404" r="4" fill="#a8473c"/>
  <circle cx="624" cy="404" r="4" fill="#a8473c"/>
  <circle cx="896" cy="404" r="4" fill="#a8473c"/>
  <circle cx="1168" cy="404" r="4" fill="#a8473c"/>

  <text x="80" y="372" font-size="15" font-weight="700" letter-spacing="1.6" fill="#a8473c">01</text>
  <text x="80" y="442" font-size="24" font-weight="700" fill="#1a1917">说来听听</text>
  <text x="80" y="476" font-size="16" fill="#6b6760">一句话也可以</text>
  <text x="80" y="500" font-size="16" fill="#6b6760">模糊就先聊</text>

  <text x="352" y="372" font-size="15" font-weight="700" letter-spacing="1.6" fill="#a8473c">02</text>
  <text x="352" y="442" font-size="24" font-weight="700" fill="#1a1917">原话 + 验收</text>
  <text x="352" y="476" font-size="16" fill="#6b6760">不改写，不加工</text>
  <text x="352" y="500" font-size="16" fill="#6b6760">写清怎样算做完</text>

  <text x="624" y="372" font-size="15" font-weight="700" letter-spacing="1.6" fill="#a8473c">03</text>
  <text x="624" y="442" font-size="24" font-weight="700" fill="#1a1917">拆成任务</text>
  <text x="624" y="476" font-size="16" fill="#6b6760">最少几步就够</text>
  <text x="624" y="500" font-size="16" fill="#6b6760">依赖和风险写明</text>

  <text x="896" y="372" font-size="15" font-weight="700" letter-spacing="1.6" fill="#a8473c">04</text>
  <text x="896" y="442" font-size="24" font-weight="700" fill="#1a1917">真跑一遍</text>
  <text x="896" y="476" font-size="16" fill="#6b6760">命令 + 退出码</text>
  <text x="896" y="500" font-size="16" fill="#6b6760">失败也是证据</text>

  <text x="1168" y="372" font-size="15" font-weight="700" letter-spacing="1.6" fill="#a8473c">05</text>
  <text x="1168" y="442" font-size="24" font-weight="700" fill="#1a1917">带证据收口</text>
  <text x="1168" y="476" font-size="16" fill="#6b6760">做了什么</text>
  <text x="1168" y="500" font-size="16" fill="#6b6760">没做什么，下一步</text>

  <line x1="80" y1="572" x2="1520" y2="572" stroke="#ddd7cd" stroke-width="1"/>
  <text x="80" y="612" font-size="18" fill="#1a1917">全部落进 &lt;project&gt;/.dsh-dev/*.jsonl —— 只追加、不改写，跟着项目走</text>
  <text x="80" y="644" font-size="16" fill="#6b6760">换 session、隔一周回来、交给别人接手：上下文在文件里，不在记忆里</text>
</g>
</svg>
