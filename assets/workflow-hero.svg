<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">How DSH Dev Workflow turns a conversation into delivery evidence</title>
<desc id="desc">A friendly educational illustration showing a developer, an AI assistant, five cards, and a local project record.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10233d"/><stop offset="1" stop-color="#1b3555"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5c7"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
 <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#15334c" flood-opacity=".13"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
 <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0ea5c7"/></marker>
</defs>
<!-- friendly editorial canvas -->
<rect width="1600" height="980" rx="40" fill="url(#paper)"/>
<circle cx="1400" cy="120" r="250" fill="#d6f5fa" opacity=".6"/><circle cx="170" cy="840" r="230" fill="#fff3c4" opacity=".48"/>
<path d="M0 170H1600" stroke="#d9e8ef" stroke-width="2"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="100" y="100" fill="#10233d" font-size="46" font-weight="800">DSH Dev Workflow</text>
 <text x="101" y="140" fill="#4b657b" font-size="23">把“聊过了”变成“做过、验过、交接得了”。</text>
 <g transform="translate(100 205)">
  <rect width="410" height="650" rx="28" fill="#fff" stroke="#d8e9ef" stroke-width="3" filter="url(#shadow)"/>
  <rect width="410" height="76" rx="28" fill="url(#navy)"/><rect y="48" width="410" height="28" fill="url(#navy)"/>
  <circle cx="48" cy="38" r="16" fill="#5eead4"/><path d="M41 38h14M48 31v14" stroke="#10233d" stroke-width="4" stroke-linecap="round"/>
  <text x="78" y="46" fill="#fff" font-size="25" font-weight="700">开发者 + AI</text>
  <text x="32" y="123" fill="#73899a" font-size="17">聊天里常见的混乱</text>
  <g transform="translate(28 150)"><rect width="350" height="72" rx="14" fill="#eff8fb"/><circle cx="30" cy="36" r="18" fill="#22c1dc"/><path d="M22 36h16M30 28v16" stroke="#fff" stroke-width="3"/><text x="60" y="31" fill="#243d54" font-size="18" font-weight="700">“顺便把登录页改一下”</text><text x="60" y="54" fill="#6c8495" font-size="15">范围？验收？谁确认？</text></g>
  <g transform="translate(28 242)"><rect width="350" height="72" rx="14" fill="#fff7df"/><circle cx="30" cy="36" r="18" fill="#fbbf24"/><path d="M30 25v14M30 48v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="60" y="31" fill="#5b4720" font-size="18" font-weight="700">“应该已经测过了”</text><text x="60" y="54" fill="#8b7544" font-size="15">命令？退出码？证据在哪？</text></g>
  <g transform="translate(28 334)"><rect width="350" height="72" rx="14" fill="#fff0f0"/><circle cx="30" cy="36" r="18" fill="#fb7185"/><path d="M23 29l14 14M37 29L23 43" stroke="#fff" stroke-width="3"/><text x="60" y="31" fill="#65313d" font-size="18" font-weight="700">“以后都按这个来”</text><text x="60" y="54" fill="#94606b" font-size="15">一次反馈，不等于永久规范</text></g>
  <path d="M44 478h322M44 505h260M44 532h300" stroke="#cbdde5" stroke-width="9" stroke-linecap="round"/>
  <text x="205" y="598" text-anchor="middle" fill="#9aafba" font-size="19">上下文会消失，证据不会自动出现</text>
 </g>
 <!-- assistant -->
 <g transform="translate(560 235)">
  <ellipse cx="185" cy="535" rx="195" ry="27" fill="#b9d9e2" opacity=".48" filter="url(#soft)"/>
  <path d="M92 175Q185 100 278 175L303 386Q185 470 67 386Z" fill="url(#navy)" filter="url(#shadow)"/>
  <circle cx="185" cy="235" r="104" fill="#1e4565" stroke="#0ea5c7" stroke-width="6"/>
  <circle cx="151" cy="225" r="12" fill="#9af3ff"/><circle cx="219" cy="225" r="12" fill="#9af3ff"/><path d="M144 278Q185 310 226 278" fill="none" stroke="#9af3ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 124V76" stroke="#0ea5c7" stroke-width="9" stroke-linecap="round"/><circle cx="185" cy="62" r="16" fill="#fbbf24"/>
  <path d="M58 305L22 346M312 305L348 346" stroke="#1e4565" stroke-width="22" stroke-linecap="round"/>
  <rect x="43" y="410" width="284" height="106" rx="22" fill="#fff" stroke="#cde5ec" stroke-width="3"/><text x="185" y="448" text-anchor="middle" fill="#10233d" font-size="22" font-weight="800">冷静 · 克制 · 可追责</text><text x="185" y="480" text-anchor="middle" fill="#5f7889" font-size="17">先问清楚，再动手</text>
  <text x="185" y="590" text-anchor="middle" fill="#4d7183" font-size="19" font-weight="700">DSH Dev Workflow</text>
 </g>
 <!-- evidence cards -->
 <g transform="translate(1010 205)">
  <text x="0" y="0" fill="#4b657b" font-size="17">它把一次对话整理成 5 张可回看的卡片</text>
  <g transform="translate(0 32)"><rect width="500" height="88" rx="18" fill="#fff" stroke="#a8e6f0" stroke-width="3" filter="url(#shadow)"/><circle cx="45" cy="44" r="25" fill="#d9f8fc"/><text x="45" y="52" text-anchor="middle" fill="#078aa8" font-size="20" font-weight="800">1</text><text x="88" y="38" fill="#10233d" font-size="21" font-weight="800">REQUEST · 需求</text><text x="88" y="65" fill="#668293" font-size="16">原话、范围、验收标准</text></g>
  <path d="M250 122v18" stroke="#0ea5c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(0 150)"><rect width="500" height="88" rx="18" fill="#fff" stroke="#a8e6f0" stroke-width="3" filter="url(#shadow)"/><circle cx="45" cy="44" r="25" fill="#d9f8fc"/><text x="45" y="52" text-anchor="middle" fill="#078aa8" font-size="20" font-weight="800">2</text><text x="88" y="38" fill="#10233d" font-size="21" font-weight="800">FEEDBACK · 反馈</text><text x="88" y="65" fill="#668293" font-size="16">原话、决策、影响</text></g>
  <path d="M250 240v18" stroke="#0ea5c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(0 268)"><rect width="500" height="88" rx="18" fill="#fff" stroke="#f6d27a" stroke-width="3" filter="url(#shadow)"/><circle cx="45" cy="44" r="25" fill="#fff3c8"/><text x="45" y="52" text-anchor="middle" fill="#b87900" font-size="20" font-weight="800">3</text><text x="88" y="38" fill="#10233d" font-size="21" font-weight="800">TASK · 任务</text><text x="88" y="65" fill="#668293" font-size="16">步骤、依赖、风险、验收</text></g>
  <path d="M250 358v18" stroke="#0ea5c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(0 386)"><rect width="500" height="88" rx="18" fill="#fff" stroke="#a8e6f0" stroke-width="3" filter="url(#shadow)"/><circle cx="45" cy="44" r="25" fill="#d9f8fc"/><text x="45" y="52" text-anchor="middle" fill="#078aa8" font-size="20" font-weight="800">4</text><text x="88" y="38" fill="#10233d" font-size="21" font-weight="800">VERIFY · 验证</text><text x="88" y="65" fill="#668293" font-size="16">命令、退出码、真实结果</text></g>
  <path d="M250 476v18" stroke="#0ea5c7" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(0 504)"><rect width="500" height="88" rx="18" fill="#fff" stroke="#f6d27a" stroke-width="3" filter="url(#shadow)"/><circle cx="45" cy="44" r="25" fill="#fff3c8"/><text x="45" y="52" text-anchor="middle" fill="#b87900" font-size="20" font-weight="800">5</text><text x="88" y="38" fill="#10233d" font-size="21" font-weight="800">COMPLETION · 收口</text><text x="88" y="65" fill="#668293" font-size="16">变更、风险、下一步、证据</text></g>
 </g>
 <!-- footer -->
 <g transform="translate(100 900)"><rect width="1400" height="55" rx="18" fill="#10233d"/><text x="30" y="36" fill="#bff7ff" font-size="18" font-weight="700">本地、append-only、可复盘</text><text x="320" y="36" fill="#d3e2e9" font-size="17">记录写入项目的 .dsh-dev/ · 不上传 · 不自动把聊天变成长期记忆</text></g>
</g></svg>
