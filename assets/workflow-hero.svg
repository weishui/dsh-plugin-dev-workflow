<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DSH Dev Workflow</title><desc id="desc">An evidence loop connecting Request, Feedback, Task, Verify and Completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101d30"/><stop offset="1" stop-color="#1a1022"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9bd7e8" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/><rect width="1600" height="900" rx="42" fill="url(#grid)"/>
  <circle cx="800" cy="450" r="220" fill="#22d3ee" opacity=".05" filter="url(#glow)"/>
  <path d="M800 180 C1130 180 1320 330 1320 450 C1320 600 1080 720 800 720 C500 720 280 600 280 450 C280 330 490 180 800 180Z" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="3" stroke-dasharray="10 16"/>
  <path d="M380 300 C510 210 690 180 800 180 M800 180 C980 180 1120 220 1230 310 M1320 450 C1320 580 1110 690 930 710 M670 710 C470 680 280 570 280 450" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(800 450)"><circle r="116" fill="#0b1728" stroke="url(#cyan)" stroke-width="5"/><circle r="88" fill="none" stroke="#fbbf24" stroke-opacity=".35" stroke-width="2"/><path d="M0-65L18-18L65 0L18 18L0 65L-18 18L-65 0L-18-18Z" fill="url(#amber)" filter="url(#glow)"/><circle r="13" fill="#fff7cc"/><text y="145" fill="#d9faff" font-size="28" font-weight="700">EVIDENCE LOOP</text></g>
    <g transform="translate(360 285)"><circle r="54" fill="#10283a" stroke="#67e8f9" stroke-width="4"/><text y="7" fill="#e8fdff" font-size="24" font-weight="700">01</text><text y="92" fill="#b9f6ff" font-size="27" font-weight="700">REQUEST</text><text y="122" fill="#91aabd" font-size="18">原话 · 验收</text></g>
    <g transform="translate(1240 285)"><circle r="54" fill="#10283a" stroke="#67e8f9" stroke-width="4"/><text y="7" fill="#e8fdff" font-size="24" font-weight="700">02</text><text y="92" fill="#b9f6ff" font-size="27" font-weight="700">FEEDBACK</text><text y="122" fill="#91aabd" font-size="18">决策 · 影响</text></g>
    <g transform="translate(1340 570)"><circle r="54" fill="#2a2112" stroke="#fbbf24" stroke-width="4"/><text y="7" fill="#fff4c2" font-size="24" font-weight="700">03</text><text y="92" fill="#ffe9a3" font-size="27" font-weight="700">TASK</text><text y="122" fill="#b9a878" font-size="18">依赖 · 风险</text></g>
    <g transform="translate(460 650)"><circle r="54" fill="#10283a" stroke="#67e8f9" stroke-width="4"/><text y="7" fill="#e8fdff" font-size="24" font-weight="700">04</text><text y="92" fill="#b9f6ff" font-size="27" font-weight="700">VERIFY</text><text y="122" fill="#91aabd" font-size="18">命令 · 退出码</text></g>
    <g transform="translate(800 730)"><circle r="54" fill="#2a2112" stroke="#fbbf24" stroke-width="4"/><text y="7" fill="#fff4c2" font-size="24" font-weight="700">05</text><text y="92" fill="#ffe9a3" font-size="27" font-weight="700">COMPLETION</text><text y="122" fill="#b9a878" font-size="18">变更 · 下一步</text></g>
  </g>
  <text x="80" y="100" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">DSH DEV WORKFLOW</text><text x="83" y="138" fill="#8ba7bb" font-family="Inter,Arial,sans-serif" font-size="21">Make the work legible. Make the proof reusable.</text>
</svg>
